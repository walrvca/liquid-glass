<!doctype html>
<html lang="en" data-theme="clean" data-accent="indigo">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#4f46e5" />
    <meta
      name="description"
      content="Explore the components, themes, and palettes of the Liquid Glass Design System."
    />
    <title>Liquid Glass — Design System</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Applies appearance before first paint; src/preferences.ts takes over afterwards. -->
    <script>
      (function () {
        var r = document.documentElement;
        var p = {};
        try {
          p =
            JSON.parse(localStorage.getItem("liquid-preferences") || "{}") ||
            {};
        } catch (e) {}
        var dark =
          typeof p.dark === "boolean"
            ? p.dark
            : matchMedia("(prefers-color-scheme: dark)").matches;
        r.dataset.theme = dark ? "dark" : "clean";
        r.classList.toggle("dark", dark);
        if (typeof p.palette === "string" && /^[a-z]+$/.test(p.palette))
          r.dataset.accent = p.palette;
        r.dataset.motion = p.reduceMotion === true ? "reduced" : "system";
        r.dataset.transparency =
          p.reduceTransparency === true ? "reduced" : "system";
      })();
    </script>
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400..700&family=Space+Grotesk:wght@400..700&family=JetBrains+Mono:wght@400..500&display=swap"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

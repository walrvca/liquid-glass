name: Bug report
description: Something does not work as expected
labels: [bug]
body:
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: "1. Open the demo\n2. Click ...\n3. See ..."
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: What happened
      description: Add screenshots if the problem is visual.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Browser, OS, and screen width
      placeholder: Firefox 140, Ubuntu 24.04, 390px
  - type: dropdown
    id: theme
    attributes:
      label: Theme
      options:
        - Light
        - Dark
        - Both
